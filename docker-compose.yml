services:
  miragate:
    # 方式一：使用 GitHub Actions 构建并推送的镜像（推荐）
    image: ghcr.io/dotracel/miragate:latest
    # 方式二：本地直接构建（把上面的 image 注释掉，取消下面注释）
    # build: .
    container_name: miragate
    restart: unless-stopped
    ports:
      - "8788:8788"          # 反代 + 用量页
    volumes:
      - miragate-data:/data  # 持久化登录凭据（config.json / device.json）
    environment:
      # ── 出站代理（可选）：http / https / socks5 均支持 ──
      # 只需设置其一即可；ALL_PROXY 会自动回退为 HTTP/HTTPS 代理。
      # - HTTP_PROXY=http://proxy-host:8080
      # - HTTPS_PROXY=http://proxy-host:8080
      # - ALL_PROXY=socks5://proxy-host:1080
      # 带认证：socks5://user:pass@proxy-host:1080
      # - NO_PROXY=localhost,127.0.0.1
      TZ: Asia/Shanghai
    command: ["serve", "--listen", "0.0.0.0:8788"]

volumes:
  miragate-data:
